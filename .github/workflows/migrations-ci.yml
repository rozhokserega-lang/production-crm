name: Migrations CI

# Проверка миграций поверх схемы прода (BASELINE.sql).
# Цель: поймать, что миграции корректно применяются к реальной схеме прода —
# не ломают существующие таблицы/views/функции. Логика идентична
# scripts/verify_migrations_locally.ps1.
#
# Подход (Вариант A): накатываем BASELINE.sql целиком (pg_dump v17 прода), затем
# миграции. Миграции, падающие на историческом дрейфе (CREATE OR REPLACE VIEW с
# урезанным набором колонок и т.п.), пишут WARNING и пропускаются — CI не падает.
# Статус определяется smoke-check. Это даёт зелёный CI, пока нет НОВЫХ регрессий.

on:
  push:
    branches: [main, test, crm]
    paths:
      - "supabase/migrations/**"
      - "supabase/BASELINE.sql"
      - ".github/workflows/migrations-ci.yml"
  pull_request:
    branches: [main, test, crm]
    paths:
      - "supabase/migrations/**"
      - "supabase/BASELINE.sql"
      - ".github/workflows/migrations-ci.yml"
  workflow_dispatch:

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Postgres 17 — версия прода (BASELINE.sql: "Dumped from database version 17.6").
        # pg_dump и сервер должны совпадать по мажорной версии.
        image: postgres:17
        env:
          POSTGRES_DB: crm_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci_password
      PGDATABASE: crm_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Drop public schema
        # Дропаем public (создаётся init-скриптом Postgres). BASELINE пересоздаст её
        # в начале (CREATE SCHEMA public). auth-shim ставим ПОСЛЕ drop, до BASELINE.
        run: psql -v ON_ERROR_STOP=1 -c "DROP SCHEMA IF EXISTS public CASCADE;"

      - name: Apply auth shim
        # Серверное окружение Supabase, не входящее в pg_dump: pgcrypto, auth-схема,
        # auth.users, auth.uid(), роли anon/authenticated/service_role.
        # Ставится ДО BASELINE, т.к. BASELINE ссылается на auth.uid() в defaults.
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/_ci_auth_shim.sql

      - name: Apply BASELINE (real prod schema)
        # Полный DDL прода (pg_dump v17). Применяется целиком — pg_dump рассчитан
        # на атомарный накат с forward-refs (check_function_bodies=off).
        run: psql -v ON_ERROR_STOP=1 -f supabase/BASELINE.sql

      - name: Apply all migrations (WARN-only on drift)
        # Миграции применяются БЕЗ ON_ERROR_STOP. Падающие на историческом дрейфе
        # пишут WARNING (::warning::) и пропускаются. CI не падает на них — только
        # на новых регрессиях, которые ломают smoke-check.
        run: |
          total=0
          failed=0
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            base="$(basename "$f")"
            # Пропускаем служебные CI-файлы (префикс _ci_) — применены явно выше.
            case "$base" in
              _ci_*) continue ;;
            esac
            total=$((total + 1))
            # Применяем без ON_ERROR_STOP, захватываем вывод для анализа.
            out="$(psql -f "$f" 2>&1 || true)"
            if echo "$out" | grep -q "ERROR:"; then
              echo "::warning::Migration $base has DRIFT (historical, not blocking)."
              echo "$out" | grep "ERROR:" | head -3 | sed 's/^/    /'
              failed=$((failed + 1))
            else
              echo "+ $base"
            fi
          done
          ok=$((total - failed))
          echo "Migrations: $ok OK, $failed drift (out of $total)."
          echo "DRIFT_COUNT=$failed" >> $GITHUB_ENV
          echo "TOTAL_COUNT=$total" >> $GITHUB_ENV
        shell: bash

      - name: Smoke check — key objects exist
        # Финальная проверка: ключевые объекты присутствуют в схеме. Если миграция
        # сломала что-то критичное — это поймает.
        run: |
          set -e
          read -r HAS_ORDERS HAS_SHIPMENT HAS_AUDIT HAS_RPC_ORDERS HAS_RPC_AUDIT < <(
            psql -t -A -F' ' -c "
              select
                (select count(*) from information_schema.tables where table_schema='public' and table_name='orders')::text,
                (select count(*) from information_schema.tables where table_schema='public' and table_name='shipment_plan_cells')::text,
                (select count(*) from information_schema.tables where table_schema='public' and table_name='crm_audit_log')::text,
                (select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='web_get_orders_all')::text,
                (select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='web_audit_log_event')::text
              ;
            "
          )
          ok=1
          [ "${HAS_ORDERS:-0}" -eq 1 ] || { echo "::error::Missing public.orders"; ok=0; }
          [ "${HAS_SHIPMENT:-0}" -eq 1 ] || { echo "::error::Missing public.shipment_plan_cells"; ok=0; }
          [ "${HAS_AUDIT:-0}" -eq 1 ] || { echo "::error::Missing public.crm_audit_log"; ok=0; }
          [ "${HAS_RPC_ORDERS:-0}" -ge 1 ] || { echo "::error::Missing RPC web_get_orders_all"; ok=0; }
          [ "${HAS_RPC_AUDIT:-0}" -ge 1 ] || { echo "::error::Missing RPC web_audit_log_event"; ok=0; }
          if [ "$ok" -ne 1 ]; then exit 1; fi
          echo "Smoke check OK."
        shell: bash

      - name: Summary
        if: always()
        run: |
          echo "### Migrations CI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Migrations applied: ${TOTAL_COUNT:-?} total, ${DRIFT_COUNT:-?} drift" >> $GITHUB_STEP_SUMMARY
          echo "- Approach: BASELINE (prod schema) + migrations in WARN-only mode" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Migrations applied over prod schema. Smoke check passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Smoke check failed or BASELINE did not apply — see log above." >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash
