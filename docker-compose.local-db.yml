# Локальная копия CRM-БД (Postgres + PostgREST + GoTrue) на случай недоступности Supabase Cloud.
# Запуск: scripts/local-db-up.ps1  или  docker compose -f docker-compose.local-db.yml up -d
#
# API (как у Supabase): http://127.0.0.1:54321/rest/v1/...  и  /auth/v1/...
# Postgres с хоста:      localhost:55432  user postgres

name: crm-local

services:
  db:
    image: postgres:17
    container_name: crm-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local_crm_dev}
      POSTGRES_DB: postgres
    ports:
      - "${LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - crm_local_pgdata:/var/lib/postgresql/data
      - ./:/work:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: crm-local-postgrest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${LOCAL_DB_PASSWORD:-local_crm_dev}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_SECRET: ${LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173,https://crm-v175.ru"
    expose:
      - "3000"

  auth:
    image: supabase/gotrue:v2.167.0
    container_name: crm-local-gotrue
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${LOCAL_API_PORT:-54321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${LOCAL_DB_PASSWORD:-local_crm_dev}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://127.0.0.1:5173
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:5173,http://localhost:5173,https://crm-v175.ru,https://www.crm-v175.ru,http://172.29.18.101:8080
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_JWT_EXP: 3600
      # Без GOTRUE_JWT_AUD логин падает: фронт не шлёт X-JWT-AUD, а у GoTrue v2.167
      # нет дефолтного audience — поиск пользователя идёт по aud='' и ничего не находит.
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMTP_HOST: "127.0.0.1"
      GOTRUE_SMTP_PORT: "587"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_ADMIN_EMAIL: admin@local.crm
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
    expose:
      - "9999"

  realtime:
    image: supabase/realtime:v2.34.47
    container_name: crm-local-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-local_crm_dev}
      DB_NAME: postgres
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SECRET_KEY_BASE: ${LOCAL_REALTIME_SECRET_BASE:-UpNVntn3cDxHJpq99yc8Z7Xacg9RC4fxtgHQwcT4qY5BPBD4fy6nO1DCD2d7opV6R}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      SLOT_NAME: supabase_realtime_replication_slot
      TEMPORARY_SLOT: "true"
      ENABLE_TAILSCALE: "false"
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
    expose:
      - "4000"

  gateway:
    image: nginx:1.27-alpine
    container_name: crm-local-gateway
    restart: unless-stopped
    depends_on:
      - rest
      - auth
      - realtime
      - functions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LOCAL_API_PORT:-54321}:8080"
    volumes:
      - ./scripts/local-db/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro

  # Edge Functions (Deno): роутер supabase/functions/_router/main.ts объединяет
  # все функции в один процесс. Шлюз проксирует /functions/v1/ на functions:54321.
  # supabase CLI для serve не годится: ему нужен полный `supabase start` + Docker.
  functions:
    build: ./functions-docker
    container_name: crm-local-functions
    restart: unless-stopped
    env_file:
      - ./supabase/functions/.env
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
      - crm_functions_cache:/deno-dir
    expose:
      - "54321"

  # Мониторинг/аптайм: статус-страница и алерты (louislam/uptime-kuma).
  # UI: http://<SRV01>:3001 — первый вход: мастер создания админа.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: crm-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - crm_kuma_data:/app/data

  # Netdata: графики CPU/RAM/диска сервера. UI: http://<SRV01>:19999
  netdata:
    image: netdata/netdata:stable
    container_name: crm-netdata
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    ports:
      - "19999:19999"

  # Оффлайн-портал: готовая сборка фронта на случай отсутствия интернета.
  # http://<SRV01>:8080 — база та же (локальный шлюз 54321).
  # Сборка: cd fronted && npm run build -- --mode offline, dist -> ./web
  web:
    image: nginx:1.27-alpine
    container_name: crm-local-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./scripts/local-db/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  crm_local_pgdata:
  crm_functions_cache:
  crm_kuma_data:
  netdataconfig:
  netdatalib:
  netdatacache:
