server {
    listen 8080;
    server_name _;

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Realtime (WebSocket)
    location /realtime/v1/ {
        proxy_pass http://realtime:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Edge Functions (supabase functions serve на хосте, порт 54322)
    location /functions/v1/ {
        proxy_pass http://host.docker.internal:54322/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        default_type application/json;
        return 200 '{"status":"crm-local-api","rest":"/rest/v1/","auth":"/auth/v1/","realtime":"/realtime/v1/","functions":"/functions/v1/"}';
    }
}
