# Vite на :5173 ходит сюда кросс-доменом — без ACAO на OPTIONS браузер режет login/RPC.
map $http_origin $cors_allow_origin {
    default "";
    "http://127.0.0.1:5173" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://172.29.18.101:8080" $http_origin;
    "https://crm-v175.ru" $http_origin;
    "https://www.crm-v175.ru" $http_origin;
}

server {
    listen 8080;
    server_name _;

    # 3D-модели секций грузятся через RPC (jsonb 0.3–3 МБ) — дефолтные 1 МБ мало
    client_max_body_size 25m;

    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, x-client-info, Prefer, X-Supabase-Api-Version" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
    add_header Access-Control-Max-Age 86400 always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location /rest/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /realtime/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_pass http://realtime:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location /functions/v1/ {
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_pass http://functions:54321/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        default_type application/json;
        return 200 '{"status":"crm-local-api","rest":"/rest/v1/","auth":"/auth/v1/","realtime":"/realtime/v1/","functions":"/functions/v1/"}';
    }
}
