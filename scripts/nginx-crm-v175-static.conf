server {
    listen 80;
    server_name crm-v175.ru www.crm-v175.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name crm-v175.ru www.crm-v175.ru;

    ssl_certificate /etc/letsencrypt/live/crm-v175.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm-v175.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/crm-v175/current;
    index index.html;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Supabase RPC через тот же домен (важно для телефонов и локальной сети, где поддомен proxy может не открываться).
    # resolver + переменная: nginx не падает при старте, если DNS ещё недоступен.
    resolver 127.0.0.53 valid=300s ipv6=off;
    set $supabase_upstream nsdwypcbhmfseotclkrm.supabase.co;

    location /supabase/ {
        proxy_pass https://$supabase_upstream/;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name nsdwypcbhmfseotclkrm.supabase.co;
        proxy_set_header Host nsdwypcbhmfseotclkrm.supabase.co;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
